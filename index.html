<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video a texto</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef4f2;color:#142722;font:18px/1.5 system-ui}main{max-width:650px;margin:5vh auto;padding:24px}h1{font-size:clamp(38px,8vw,58px);line-height:1.04;margin:.25em 0 .45em}form,section{background:white;padding:22px;border:1px solid #c4d4ce;border-radius:18px;margin-top:20px}label{display:block;font-weight:650;margin:.6em 0}input,textarea,button{font:inherit;width:100%;padding:12px;border-radius:9px;border:1px solid #849c92}button{cursor:pointer;background:#105945;color:white;border:0;font-weight:650;margin-top:12px}button:disabled{opacity:.65}small{display:block;margin-top:.5em}textarea{min-height:180px}#status:empty{display:none}
</style>
<main><h1>Video a texto</h1><p>Saca las palabras de un TikTok y copia la transcripción.</p>
<form><label for="url">Enlace de TikTok</label><input id="url" type="url" placeholder="https://www.tiktok.com/…"><small>Para abrir el enlace se consulta TikWM.</small>
<label for="file">O elige un video de Fotos</label><input id="file" type="file" accept="video/*,audio/*"><small>El archivo se procesa en tu dispositivo. La primera vez se descarga el modelo de voz.</small>
<button id="start">Sacar el texto</button></form><p id="status" role="status"></p>
<section hidden id="result"><label for="out">Transcripción</label><textarea id="out"></textarea><button id="copy">Copiar texto</button><button id="save">Guardar como TXT</button></section></main>
<script type="module" src="./app.js"></script></html>
